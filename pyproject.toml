[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-dvd-prototype"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "networkx",
    "rustworkx>=0.14.0",
    "matplotlib",
    "numpy",
    "scipy>=1.12",
]

[project.optional-dependencies]
test = ["pytest", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
pdn-parse = "parser.pdn_parser:main"
pdn-solve = "solver.pdn_solver:main"
sigma-dvd = "distributed.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--tb=short",
]
markers = [
    "unit: fast isolated unit tests",
    "integration: integration tests (slow, require test netlists)",
    "validation: validation reference path tests (hierarchical, tiled, legacy)",
    "benchmark: performance benchmark tests (slow, measure throughput)",
]
